name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Checkout backend OpenAPI
        uses: actions/checkout@v7
        with:
          repository: UCHIDAnobuhiro/stock-backend
          path: .openapi-source/stock-backend
          sparse-checkout: api/openapi.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend OpenAPI sync
        run: diff -u .openapi-source/stock-backend/api/openapi.yaml openapi/openapi.yaml

      - name: Check generated API types
        run: npm run check:api

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout backend OpenAPI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: UCHIDAnobuhiro/stock-backend
          path: .openapi-source/stock-backend
          sparse-checkout: api/openapi.yaml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Check backend OpenAPI sync
        run: diff -u .openapi-source/stock-backend/api/openapi.yaml openapi/openapi.yaml

      - name: Check generated API types
        run: npm run check:api

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
